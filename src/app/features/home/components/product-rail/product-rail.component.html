<section class="container product-rail">
  <div class="product-rail__heading">
    <div>
      <h2>{{ title }}</h2>
      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
    <div class="product-rail__controls">
      <a [routerLink]="viewAllLink" [queryParams]="viewAllQueryParams" class="product-rail__view-all">View All</a>
      <button type="button" class="rail-nav-btn" (click)="scroll('prev')" aria-label="Scroll left">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="rail-nav-btn" (click)="scroll('next')" aria-label="Scroll right">
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  @if (products.length) {
    <div class="product-rail__track" #track>
      @for (product of products; track product.id) {
        <div class="product-rail__item">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  } @else {
    <div class="product-rail__empty">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="skeleton-card"></div>
      }
    </div>
  }
</section>
