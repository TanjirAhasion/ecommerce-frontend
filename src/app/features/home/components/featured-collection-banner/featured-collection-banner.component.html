<section class="feature-banner">
  <img
    src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1800"
    alt="New season collection"
    loading="lazy"
    class="feature-banner__image"
  />
  <div class="container feature-banner__content">
    <p class="feature-banner__eyebrow">Featured Collection</p>
    <h2>New Season Collection</h2>
    <p class="feature-banner__subtitle">Designed for modern everyday style.</p>
    <a routerLink="/shop" [queryParams]="{ collection: 'new-season' }" class="btn-brand">Explore Collection</a>
  </div>
</section>
